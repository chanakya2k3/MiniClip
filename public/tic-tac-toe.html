<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MINICLIP — server-authoritative arena</title>
  <!-- Pixel display face. If it can't load (offline), the monospace stack in
       style.css takes over and the layout is unaffected. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" id="appStyles" />
  <style>
    /* In-match chat + voice. Kept in this file rather than style.css so the
       dev CSS hot-swap of style.css stays untouched. */
    .commsbar {
      margin-top: 18px;
      border: 3px solid var(--panel-line, #2a2d4a);
      border-radius: 8px;
      background: rgba(8, 10, 20, .6);
      overflow: hidden;
    }
    .comms-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 3px solid var(--panel-line, #2a2d4a);
      font-size: 10px;
      letter-spacing: 2px;
      color: #8b8fb5;
    }
    .comms-head b { color: #fdf6e3; font-weight: normal; }
    .comms-spacer { flex: 1; }

    .vbtn {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 5px;
      border: 2px solid #1a3d0d;
      background: #5ec93f;
      color: #0d2005;
    }
    .vbtn:hover:not(:disabled) { background: #8ef05f; }
    .vbtn:disabled { opacity: .45; cursor: not-allowed; }
    .vbtn.off { background: #1d2039; color: #8b8fb5; border-color: #2a2d4a; }
    .vbtn.live { background: #ff6b6b; color: #2a0000; border-color: #6b1f1f; }

    .voice-state { font-size: 9px; letter-spacing: 1px; color: #8b8fb5; }

    .chat-feed {
      height: 150px;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      scrollbar-width: thin;
      scrollbar-color: #2a2d4a transparent;
    }
    .chat-feed::-webkit-scrollbar { width: 8px; }
    .chat-feed::-webkit-scrollbar-thumb { background: #2a2d4a; border-radius: 4px; }

    .cmsg { font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .cmsg .who { color: #8ef05f; letter-spacing: 1px; }
    .cmsg .who.guest { color: #8b8fb5; }
    .cmsg .tag {
      font-size: 8px;
      letter-spacing: 1px;
      padding: 1px 4px;
      border-radius: 3px;
      border: 1px solid #2a2d4a;
      color: #8b8fb5;
      margin-left: 4px;
    }
    .cmsg .txt { color: #fdf6e3; }
    .cmsg.system { color: #8b8fb5; font-style: italic; font-size: 11px; }

    .chat-send {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 3px solid var(--panel-line, #2a2d4a);
    }
    .chat-send input {
      flex: 1;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #fdf6e3;
      background: #1d2039;
      border: 2px solid #2a2d4a;
      border-radius: 5px;
      padding: 8px 10px;
      outline: none;
    }
    .chat-send input:focus { border-color: #5ec93f; }
  </style>
</head>
<body>
  <!-- Purely decorative backdrop; kept out of the game markup so a restyle
       can't accidentally disturb the board. -->
  <div class="backdrop" aria-hidden="true">
    <div class="bd-stars bd-stars--far"></div>
    <div class="bd-stars bd-stars--near"></div>
    <div class="bd-horizon"></div>
    <div class="bd-sprites">
      <span class="sprite sprite--1">▚</span>
      <span class="sprite sprite--2">◆</span>
      <span class="sprite sprite--3">▲</span>
      <span class="sprite sprite--4">●</span>
    </div>
    <div class="bd-scanlines"></div>
    <div class="bd-vignette"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▚</span>
      <span class="brand-name">MINI<span class="brand-name-accent">CLIP</span></span>
    </div>
    <div class="link-status" id="linkStatus" data-state="offline">
      <span class="link-dot"></span>
      <span class="link-label" id="linkLabel">CONNECTING</span>
    </div>
  </header>

  <main class="stage">
    <!-- Join panel -->
    <section class="panel" id="joinForm">
      <h1 class="panel-title">INSERT COIN</h1>
      <p class="panel-sub">Every move is validated server-side. Your client is a viewport, not a referee.</p>

      <label class="field">
        <span class="field-label">CABINET</span>
        <input id="roomId" placeholder="room1" value="room1" autocomplete="off" spellcheck="false" />
      </label>

      <label class="field">
        <span class="field-label">ENTER NAME</span>
        <input id="name" placeholder="AAA" value="Player" autocomplete="off" spellcheck="false" maxlength="16" />
      </label>

      <button id="joinBtn" class="btn btn--primary">
        <span>PRESS START</span>
      </button>
    </section>

    <!-- Game view -->
    <section class="arena" id="arena" hidden>
      <div class="roster">
        <article class="seat" id="seatYou">
          <span class="seat-role">1UP</span>
          <span class="seat-symbol" id="youSymbol">—</span>
          <span class="seat-name" id="youName">—</span>
          <span class="seat-state" id="youState"></span>
        </article>

        <div class="versus">VS</div>

        <article class="seat" id="seatOpp">
          <span class="seat-role">2UP</span>
          <span class="seat-symbol" id="oppSymbol">—</span>
          <span class="seat-name" id="oppName">waiting…</span>
          <span class="seat-state" id="oppState"></span>
        </article>
      </div>

      <div class="turnbar" id="turnbar" data-state="idle">
        <span class="turnbar-text" id="status">Connecting…</span>
      </div>
      <div class="board-shell">
        <div id="board" class="board"></div>
      </div>

      <div class="actions">
        <button id="rematchBtn" class="btn btn--ghost" hidden>PLAY AGAIN</button>
        <span class="room-tag">CAB <b id="roomTag">—</b></span>
      </div>

      <!-- Match chat + voice. Not persisted: this is banter attached to a
           room that stops existing when the players leave. -->
      <div class="commsbar">
        <div class="comms-head">
          <b>COMMS</b>
          <span class="comms-spacer"></span>
          <span class="voice-state" id="voiceState">voice off</span>
          <button class="vbtn off" id="voiceBtn" type="button">🎙 VOICE</button>
          <button class="vbtn off" id="muteBtn" type="button" hidden>MUTE</button>
        </div>

        <div class="chat-feed" id="chatFeed"></div>

        <form class="chat-send" id="chatForm">
          <input id="chatInput" type="text" placeholder="message the room…"
                 maxlength="300" autocomplete="off" />
          <button class="vbtn" type="submit">SEND</button>
        </form>
      </div>
    </section>

    <!-- The remote player's audio. autoplay + playsinline; not muted, or
         there'd be no point. Hidden because there are no controls to show. -->
    <audio id="remoteAudio" autoplay playsinline style="display:none"></audio>
  </main>

  <div class="toast" id="error" role="status" aria-live="polite"></div>

  <!-- Socket.io client served automatically by the socket.io server -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Same-origin when served by server.js (http://localhost:3001), with a
    // fallback for opening the file directly off disk.
    const socket = location.protocol.startsWith("http")
      ? io()
      : io("http://localhost:3001");

    const $ = (id) => document.getElementById(id);  

    const boardEl = $("board");
    const statusEl = $("status");
    const turnbarEl = $("turnbar");
    const errorEl = $("error");
    const rematchBtn = $("rematchBtn");
    const roomInput = $("roomId");
    const nameInput = $("name");
    const joinForm = $("joinForm");
    const arenaEl = $("arena");
    const linkStatus = $("linkStatus");
    const linkLabel = $("linkLabel");
    const roomTag = $("roomTag");

    let mySymbol = null; // set once the server tells us, never assumed locally
    let lastWinKey = null; // so the win animation fires once, not on every state

    const STORAGE_KEYS = {
      playerId: "miniClipPlayerId",
      roomId: "miniClipRoomId",
      name: "miniClipName",
    };

    // sessionStorage, not localStorage, on purpose: it survives a reload
    // (so a UI edit doesn't cost you your seat) but a second tab gets its
    // own identity, which is how you play both sides while developing.
    function getOrCreatePlayerId() {
      let playerId = sessionStorage.getItem(STORAGE_KEYS.playerId);
      if (!playerId) {
        playerId = crypto.randomUUID();
        sessionStorage.setItem(STORAGE_KEYS.playerId, playerId);
      }
      return playerId;
    }

    function joinRoom(roomId, name) {
      if (!roomId) return;
      sessionStorage.setItem(STORAGE_KEYS.roomId, roomId);
      sessionStorage.setItem(STORAGE_KEYS.name, name);
      socket.emit("room:join", { roomId, name, playerId: getOrCreatePlayerId() });
    }

    // Restore what we typed last time so a reload doesn't make us re-enter it.
    const storedRoomId = sessionStorage.getItem(STORAGE_KEYS.roomId);
    const storedName = sessionStorage.getItem(STORAGE_KEYS.name);
    if (storedRoomId) roomInput.value = storedRoomId;
    if (storedName) nameInput.value = storedName;

    $("joinBtn").addEventListener("click", () => {
      joinRoom(roomInput.value.trim(), nameInput.value.trim() || "Player");
    });

    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("joinBtn").click();
    });
    roomInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("joinBtn").click();
    });

    function setLink(state, label) {
      linkStatus.dataset.state = state;
      linkLabel.textContent = label;
    }

    // Fires on first connect AND on every socket.io auto-reconnect. Rejoining
    // with the same playerId is what makes a refresh land back in the same seat.
    socket.on("connect", () => {
      setLink("online", "ONLINE");
      const roomId = sessionStorage.getItem(STORAGE_KEYS.roomId);
      if (roomId) joinRoom(roomId, nameInput.value.trim() || "Player");
    });

    socket.on("disconnect", () => {
      setLink("offline", "RECONNECTING");
    });

    rematchBtn.addEventListener("click", () => {
      socket.emit("room:rematch");
      lastWinKey = null;
    });

    // ---- Rendering ----------------------------------------------------
    // The 9 cells are created once and then patched in place. Rebuilding
    // the DOM on every state message would throw away focus, hover and any
    // CSS transition mid-flight — and it makes a style edit look like a
    // flicker instead of an instant change.
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const div = document.createElement("button");
      div.type = "button";
      div.className = "cell";
      div.dataset.index = String(i);
      div.innerHTML = '<span class="cell-mark"></span>';
      div.addEventListener("click", () => {
        // We don't check whose turn it is here on purpose — let the
        // server be the judge. Worst case it sends back an error.
        socket.emit("game:action", { cellIndex: i });
      });
      boardEl.appendChild(div);
      cells.push(div);
    }

    function renderBoard(state) {
      const winSet = new Set(state.winningLine || []);
      state.board.forEach((cell, i) => {
        const el = cells[i];
        const mark = el.firstElementChild;
        const value = cell || "";

        if (mark.textContent !== value) {
          mark.textContent = value;
          // Retrigger the drop-in animation only when the mark is new.
          if (value) {
            mark.classList.remove("is-placed");
            void mark.offsetWidth; // force reflow so the animation replays
            mark.classList.add("is-placed");
          }
        }

        el.dataset.mark = value; // 'X' | 'O' | '' — drives the neon color
        el.classList.toggle("is-taken", Boolean(cell));
        el.classList.toggle("is-win", winSet.has(i));
        el.classList.toggle(
          "is-playable",
          state.status === "IN_PROGRESS" && !cell && state.turn === mySymbol
        );
        el.disabled = Boolean(cell) || state.status !== "IN_PROGRESS";
      });
    }

    function renderRoster(state) {
      const you = state.players.find((p) => p.symbol === mySymbol);
      const opp = state.players.find((p) => p.symbol !== mySymbol);

      $("youSymbol").textContent = you ? you.symbol : "—";
      $("youName").textContent = you ? you.name : "—";
      $("seatYou").dataset.mark = you ? you.symbol : "";
      $("youState").textContent = "";

      $("oppSymbol").textContent = opp ? opp.symbol : "—";
      $("oppName").textContent = opp ? opp.name : "waiting…";
      $("seatOpp").dataset.mark = opp ? opp.symbol : "";
      // A player who dropped still holds their seat; say so rather than
      // pretending the game ended.
      $("oppState").textContent = opp && !opp.connected ? "PAUSED — PLAYER AWAY" : "";
      $("seatOpp").classList.toggle("is-away", Boolean(opp && !opp.connected));

      // Highlight whoever is on the clock.
      const active = state.status === "IN_PROGRESS" ? state.turn : null;
      $("seatYou").classList.toggle("is-active", Boolean(you) && active === you?.symbol);
      $("seatOpp").classList.toggle("is-active", Boolean(opp) && active === opp?.symbol);
    }

    function renderStatus(state) {
      if (state.status === "LOBBY") {
        statusEl.textContent = "WAITING FOR PLAYER 2";
        turnbarEl.dataset.state = "waiting";
      } else if (state.status === "IN_PROGRESS") {
        const mine = state.turn === mySymbol;
        statusEl.textContent = mine ? "YOUR TURN" : `PLAYER ${state.turn} TURN`;
        turnbarEl.dataset.state = mine ? "yours" : "theirs";
      } else if (state.status === "FINISHED") {
        if (state.winner === "DRAW") {
          statusEl.textContent = "DRAW GAME";
          turnbarEl.dataset.state = "draw";
        } else {
          const won = state.winner === mySymbol;
          statusEl.textContent = won ? "YOU WIN!" : "GAME OVER";
          turnbarEl.dataset.state = won ? "win" : "loss";
        }

        // Fire the flourish once per finished game, not on every rebroadcast.
        const key = `${state.winner}:${(state.winningLine || []).join("")}`;
        if (key !== lastWinKey) {
          lastWinKey = key;
          document.body.classList.add("is-settling");
          setTimeout(() => document.body.classList.remove("is-settling"), 700);
        }
      }

      rematchBtn.hidden = state.status !== "FINISHED";
      roomTag.textContent = state.id;
    }

    let toastTimer = null;
    function toast(message) {
      errorEl.textContent = message;
      errorEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => errorEl.classList.remove("is-visible"), 2600);
    }

    socket.on("room:joined", ({ symbol, roomId, username }) => {
      mySymbol = symbol;
      joinForm.hidden = true;
      arenaEl.hidden = false;

      // Chat rides the same room id as the game. Declared further down with
      // the comms code; assigning here is safe because socket events only
      // fire after this script has finished executing.
      currentRoomId = roomId;
      socket.emit("chat:join", { roomId });

      // The server tells us whether this socket is an authenticated account.
      // Guests can still chat, but their messages carry a GUEST tag.
      if (username) {
        nameInput.value = username;
        nameInput.disabled = true;
        nameInput.title = "Your account name — logged-in players can't be impersonated.";
      }
    });

    socket.on("room:state", (state) => {
      renderRoster(state);
      renderBoard(state);
      renderStatus(state);
    });

    socket.on("error", ({ message }) => {
      toast(message);
    });

    // ================= MATCH CHAT =====================================
    // Ephemeral, room-scoped. The server stamps the sender's name from their
    // session, so a logged-in player can't be impersonated — a guest's chosen
    // name is shown with a GUEST tag instead.

    const chatFeed = $("chatFeed");
    const chatForm = $("chatForm");
    const chatInput = $("chatInput");
    let currentRoomId = null;

    function appendChat(message) {
      const atBottom =
        chatFeed.scrollHeight - chatFeed.scrollTop - chatFeed.clientHeight < 40;

      const line = document.createElement("div");
      line.className = "cmsg";

      const who = document.createElement("span");
      who.className = "who" + (message.registered ? "" : " guest");
      who.textContent = message.username;
      line.append(who);

      if (!message.registered) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "GUEST";
        line.append(tag);
      }

      line.append(document.createTextNode(": "));

      const text = document.createElement("span");
      text.className = "txt";
      // textContent, so a message body is text and never markup.
      text.textContent = message.body;
      line.append(text);

      chatFeed.append(line);
      if (atBottom) chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function appendSystem(text) {
      const line = document.createElement("div");
      line.className = "cmsg system";
      line.textContent = text;
      chatFeed.append(line);
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const body = chatInput.value.trim();
      if (!body || !currentRoomId) return;

      socket.emit("chat:message", {
        roomId: currentRoomId,
        body,
        name: nameInput.value.trim() || "Player",
      });
      chatInput.value = "";
    });

    socket.on("chat:backlog", ({ messages }) => {
      chatFeed.innerHTML = "";
      for (const message of messages) appendChat(message);
    });

    socket.on("chat:message", appendChat);
    socket.on("chat:error", ({ message }) => appendSystem(message));

    // ================= VOICE CHAT (WebRTC) =============================
    //
    // The audio is peer-to-peer: it never passes through the Node server.
    // The server only relays the handshake (see src/realtime/voice.js).
    //
    // Flow, once both sides have joined the voice channel:
    //   newcomer  → createOffer  → setLocalDescription  → send offer
    //   incumbent → setRemote(offer) → createAnswer → setLocal → send answer
    //   newcomer  → setRemote(answer)
    //   both      → trickle ICE candidates at each other until one pair works
    //
    // Whoever arrives second makes the offer. Without a rule like that both
    // peers offer at once and the negotiation collides ("glare").

    const voiceBtn = $("voiceBtn");
    const muteBtn = $("muteBtn");
    const voiceState = $("voiceState");
    const remoteAudio = $("remoteAudio");

    const ICE_SERVERS = [
      // Public STUN. This only helps each peer discover its own public
      // address; it carries no audio. Symmetric NAT (many corporate and
      // mobile networks) defeats it and needs a TURN relay, which can't be
      // free — see the note in src/realtime/voice.js.
      { urls: "stun:stun.l.google.com:19302" },
    ];

    let pc = null;              // RTCPeerConnection
    let localStream = null;
    let peerSocketId = null;
    let inVoice = false;
    let muted = false;
    // ICE candidates can arrive before the remote description is set;
    // addIceCandidate throws if it does. Queue them until we're ready.
    let pendingCandidates = [];

    function setVoiceState(text) {
      voiceState.textContent = text;
    }

    function closePeer() {
      if (pc) {
        pc.onicecandidate = null;
        pc.ontrack = null;
        pc.onconnectionstatechange = null;
        pc.close();
        pc = null;
      }
      peerSocketId = null;
      pendingCandidates = [];
      remoteAudio.srcObject = null;
    }

    function stopVoice(announce = true) {
      if (announce && inVoice) socket.emit("voice:leave");
      inVoice = false;

      closePeer();

      if (localStream) {
        // Releases the microphone, which also turns off the browser's
        // recording indicator. Leaving tracks live is how a page ends up
        // holding the mic open after the user thinks they hung up.
        for (const track of localStream.getTracks()) track.stop();
        localStream = null;
      }

      voiceBtn.textContent = "🎙 VOICE";
      voiceBtn.className = "vbtn off";
      muteBtn.hidden = true;
      muted = false;
      muteBtn.textContent = "MUTE";
      setVoiceState("voice off");
    }

    async function startVoice() {
      if (!currentRoomId) return;

      if (!navigator.mediaDevices?.getUserMedia) {
        // getUserMedia needs a secure context. localhost counts as secure,
        // so this fires mainly when the site is served over plain http from
        // a non-local host.
        setVoiceState("needs https");
        appendSystem("Voice needs a secure connection (https or localhost).");
        return;
      }

      try {
        setVoiceState("asking for mic…");
        localStream = await navigator.mediaDevices.getUserMedia({
          // Browser-side processing. Without echoCancellation, each player
          // hears themselves back through the other's speakers.
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false,
        });
      } catch (err) {
        setVoiceState("mic blocked");
        appendSystem(
          err.name === "NotAllowedError"
            ? "Microphone permission denied."
            : "No microphone available."
        );
        return;
      }

      inVoice = true;
      voiceBtn.textContent = "✕ LEAVE";
      voiceBtn.className = "vbtn live";
      muteBtn.hidden = false;
      setVoiceState("connecting…");

      socket.emit("voice:join", { roomId: currentRoomId });
    }

    function createPeer(remoteSocketId) {
      peerSocketId = remoteSocketId;
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      for (const track of localStream.getTracks()) {
        pc.addTrack(track, localStream);
      }

      pc.onicecandidate = (event) => {
        if (!event.candidate) return;   // null marks the end of gathering
        socket.emit("voice:signal", {
          to: peerSocketId,
          data: { type: "candidate", candidate: event.candidate },
        });
      };

      pc.ontrack = (event) => {
        remoteAudio.srcObject = event.streams[0];
      };

      pc.onconnectionstatechange = () => {
        const state = pc?.connectionState;
        if (state === "connected") setVoiceState("● live");
        else if (state === "connecting") setVoiceState("connecting…");
        else if (state === "failed") {
          // Almost always NAT traversal, which is the STUN-only limitation.
          setVoiceState("couldn't connect");
          appendSystem("Voice couldn't connect — the network blocks peer-to-peer audio.");
        } else if (state === "disconnected" || state === "closed") {
          setVoiceState(inVoice ? "peer left" : "voice off");
        }
      };

      return pc;
    }

    async function flushCandidates() {
      for (const candidate of pendingCandidates) {
        try { await pc.addIceCandidate(candidate); } catch { /* stale candidate */ }
      }
      pendingCandidates = [];
    }

    socket.on("voice:joined", async ({ peers }) => {
      if (!inVoice) return;

      if (peers.length === 0) {
        setVoiceState("waiting for the other player…");
        return;   // first one in; the next arrival will offer
      }

      // Someone's already here, so we're the newcomer and we initiate.
      const peer = peers[0];
      appendSystem(`Voice: connecting to ${peer.username}…`);

      createPeer(peer.socketId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("voice:signal", { to: peer.socketId, data: { type: "offer", sdp: offer } });
    });

    socket.on("voice:peer-joined", ({ username }) => {
      if (!inVoice) return;
      appendSystem(`Voice: ${username} joined the channel.`);
      setVoiceState("connecting…");
      // They'll send the offer; nothing to do but wait.
    });

    socket.on("voice:peer-left", () => {
      if (!inVoice) return;
      appendSystem("Voice: the other player left the channel.");
      closePeer();
      setVoiceState("waiting for the other player…");
    });

    socket.on("voice:error", ({ message }) => {
      appendSystem("Voice: " + message);
      stopVoice(false);
    });

    socket.on("voice:signal", async ({ from, data }) => {
      if (!inVoice || !localStream) return;

      try {
        if (data.type === "offer") {
          if (!pc) createPeer(from);
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          await flushCandidates();

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit("voice:signal", { to: from, data: { type: "answer", sdp: answer } });
        } else if (data.type === "answer") {
          if (!pc) return;
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          await flushCandidates();
        } else if (data.type === "candidate") {
          const candidate = new RTCIceCandidate(data.candidate);
          // Buffer until there's a remote description to attach it to.
          if (!pc || !pc.remoteDescription) pendingCandidates.push(candidate);
          else await pc.addIceCandidate(candidate);
        }
      } catch (err) {
        console.error("voice signalling failed:", err);
        setVoiceState("connection error");
      }
    });

    voiceBtn.addEventListener("click", () => {
      if (inVoice) stopVoice();
      else startVoice();
    });

    muteBtn.addEventListener("click", () => {
      if (!localStream) return;
      muted = !muted;
      // Disabling the track keeps the connection up but sends silence —
      // cleaner than renegotiating, and instant.
      for (const track of localStream.getAudioTracks()) track.enabled = !muted;
      muteBtn.textContent = muted ? "UNMUTE" : "MUTE";
      muteBtn.className = "vbtn " + (muted ? "live" : "off");
    });

    // Release the microphone if the tab goes away mid-call.
    window.addEventListener("pagehide", () => stopVoice(false));

    // ---- Dev live-reload ----------------------------------------------
    // A CSS change swaps the stylesheet under the running page: no reload,
    // no socket churn, no state lost — the board you're staring at just
    // restyles. Structural changes can't be hot-swapped, so we reload and
    // let the playerId rejoin put us back in the same game.
    socket.on("dev:css", ({ version }) => {
      const link = document.getElementById("appStyles");
      const fresh = link.cloneNode();
      fresh.href = `style.css?v=${version}`;
      // Only drop the old stylesheet once the new one has painted, so
      // there's no unstyled frame in between.
      fresh.addEventListener("load", () => link.remove(), { once: true });
      link.parentNode.insertBefore(fresh, link.nextSibling);
    });

    socket.on("dev:reload", () => {
      location.reload();
    });
  </script>
</body>
</html>
